version: 2

# Version updates only. The security half (alerts and security updates) is a repository setting.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is installed as @typescript/native (svelte-check runs it with --tsgo); svelte-check still needs
      # TypeScript 6 as `typescript`, so that one stays on 6 until svelte-check supports 7 directly.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
