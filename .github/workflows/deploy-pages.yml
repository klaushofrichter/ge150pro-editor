# A push to production builds the app and publishes it on GitHub Pages, with a calendar version (YYYY.MM.DD.N)
# shown in the app's tools panel and recorded as a GitHub release.
name: Deploy to GitHub Pages
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: write # the release
  pages: write
  id-token: write
  actions: read # to see the uploaded artifact listed

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version
        id: version
        run: |
          day=$(date -u +%Y.%m.%d)
          n=$(git tag -l "v$day.*" | wc -l)
          echo "version=$day.$((n + 1))" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # deploy-pages looks the artifact up once, right away; GitHub sometimes lists a new artifact only seconds later
      # (2026-11-24: "No artifacts named github-pages" three times in a row), so wait until it is listed
      - name: Wait for the artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && exit 0
            sleep 4
          done
          echo "::error::the github-pages artifact was not listed after 2 minutes"
          exit 1
      - id: pages
        uses: actions/deploy-pages@v5
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "Published at ${{ steps.pages.outputs.page_url }}"
