# A push to production builds the app and publishes it on GitHub Pages, with a calendar version (YYYY.MM.DD.N)
# shown in the app's tools panel and recorded as a GitHub release.
# Two jobs, as in GitHub's Pages starter workflow: deploy-pages in the same job as the upload sometimes found no
# artifact (2026-11-24, four times, even after the artifact API listed it); a separate job starts after the upload
# is complete.
name: Deploy to GitHub Pages
on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Version
        id: version
        run: |
          day=$(date -u +%Y.%m.%d)
          n=$(git tag -l "v$day.*" | wc -l)
          echo "version=$day.$((n + 1))" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v5
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION" --notes "Published at ${{ steps.pages.outputs.page_url }}"
